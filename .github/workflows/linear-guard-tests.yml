name: Linear Guard Tests

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate release
        run: python tools/validate_release.py
      - name: Run security tests
        run: python tools/security_test.py
      - name: Run Phase 1 read tests
        run: python tools/v15_read_test.py
      - name: Run Phase 2 triage tests
        run: python tools/v15_triage_test.py
      - name: Run Phase 3 sprint-plan tests
        run: python tools/v15_plan_sprint_test.py
      - name: Run Phase 4 sprint-rebalance tests
        run: python tools/v15_rebalance_sprint_test.py
      - name: Build clean release archive
        run: python tools/build_release.py
      - name: Verify release archive
        run: python tools/release_acceptance_test.py
